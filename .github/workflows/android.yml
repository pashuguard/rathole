name: Android Build
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Force stable toolchain (ignore repo rust-toolchain.toml)
        run: rustup override set stable

      - name: Check Rust Version
        run: |
          rustc --version
          cargo --version
          which cargo

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rathole
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          cargo ndk \
            --platform 24 \
            --target ${{ matrix.target }} \
            build \
            --release \
            --no-default-features \
            --features client,rustls,noise,websocket-rustls

      - name: Strip Binary
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
          target/${{ matrix.target }}/release/rathole || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rathole-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/rathole
